formulas:
  - id: gittervektor
    section: Gitter og basis
    tex: "\\vec{R} = n_1\\vec{a}_1 + n_2\\vec{a}_2 + n_3\\vec{a}_3"
    label: "Gittervektor. $n_i$ er <b>heltall</b> og $\\vec{a}_i$ de primitive gittervektorene. Mengden av alle $\\vec{R}$ <em>er</em> Bravais-gitteret."
  - id: translasjonsoperasjon
    section: Gitter og basis
    tex: "\\vec{r}\\,' = \\vec{r} + \\vec{R}"
    label: "Translasjonsoperasjonen. Et Bravais-gitter ser identisk ut fra $\\vec{r}$ og fra $\\vec{r}\\,'$ for enhver gittervektor $\\vec{R}$."
  - id: basis-posisjon
    section: Gitter og basis
    tex: "\\vec{r}_j = x_j\\vec{a}_1 + y_j\\vec{a}_2 + z_j\\vec{a}_3"
    label: "Posisjonen til atom $j$ i basisen, oppgitt i <b>relative</b> koordinater $0 \\le x_j, y_j, z_j < 1$."
  - id: primitiv-celle-volum
    section: Enhetsceller
    tex: "V_c = \\left|\\vec{a}_1 \\cdot (\\vec{a}_2 \\times \\vec{a}_3)\\right|"
    label: "Volumet av den primitive enhetscellen. Alle valg av primitiv celle gir <b>samme</b> volum."
  - id: atomer-per-celle
    section: Enhetsceller
    tex: "N = N_\\mathrm{i} + \\dfrac{N_\\mathrm{f}}{2} + \\dfrac{N_\\mathrm{k}}{4} + \\dfrac{N_\\mathrm{h}}{8}"
    label: "Antall atomer per enhetscelle ved deling med naboceller: indre (i) telles helt, flate (f) halvt, kant (k) kvart og hjørne (h) åttendedels."
  - id: pakningsgrad
    section: Enhetsceller
    tex: "f = \\dfrac{N \\cdot \\tfrac{4}{3}\\pi r^3}{V_\\text{celle}}"
    label: "Pakningsgrad (<em>packing fraction</em>): andelen av cellevolumet fylt av harde kuler med radius $r$, der $N$ er antall atomer i cellen."
  - id: naboavstand-fcc
    section: Kubiske gitter
    tex: "d_\\text{fcc} = \\dfrac{a}{\\sqrt{2}}, \\qquad r = \\dfrac{a\\sqrt{2}}{4}"
    label: "Nærmeste naboavstand og hardkuleradius i et flatesentrert kubisk gitter med gitterkonstant $a$. Kulene berører langs <b>flatediagonalen</b>."
  - id: naboavstand-bcc
    section: Kubiske gitter
    tex: "d_\\text{bcc} = \\dfrac{a\\sqrt{3}}{2}, \\qquad r = \\dfrac{a\\sqrt{3}}{4}"
    label: "Nærmeste naboavstand og hardkuleradius i et romsentrert kubisk gitter. Kulene berører langs <b>romdiagonalen</b>."

glossary:
  - term: Bravais-gitter
    section: Gitter og basis
    definition: "Et uendelig sett av punkter generert av $\\vec{R} = n_1\\vec{a}_1 + n_2\\vec{a}_2 + n_3\\vec{a}_3$ med heltallige $n_i$. Avgjørende egenskap: gitteret ser <b>nøyaktig likt ut</b> sett fra ethvert gitterpunkt. Et gitter er ren geometri — det inneholder ingen atomer."
  - term: Gitterpunkt
    section: Gitter og basis
    definition: "Et av de matematiske punktene i et Bravais-gitter. Det er ikke det samme som et atom: atomene kommer fra basisen som plasseres på hvert gitterpunkt."
  - term: Primitive gittervektorer
    section: Gitter og basis
    definition: "Et sett vektorer $\\vec{a}_1, \\vec{a}_2, \\vec{a}_3$ som genererer <em>alle</em> gitterpunkter med heltallige koeffisienter, og ikke flere. Valget er ikke entydig — samme gitter har uendelig mange gyldige sett."
  - term: Basis
    section: Gitter og basis
    definition: "Gruppen av atomer som festes til hvert eneste gitterpunkt, oppgitt ved posisjonene $\\vec{r}_j$ relativt til punktet. Basisen er identisk på alle gitterpunkter, i sammensetning, orientering og avstander."
  - term: Krystallstruktur
    section: Gitter og basis
    definition: "Gitter $+$ basis. Strukturen er det fysiske arrangementet av atomer; gitteret alene er bare translasjonsmønsteret det gjentas etter."
  - term: Gitterkonstant
    section: Gitter og basis
    definition: "Kantlengdene $a, b, c$ i den konvensjonelle enhetscellen. For kubiske gitter er det én verdi $a$, og den brukes som lengdeskala for alt annet i cellen."
  - term: Enhetscelle
    section: Enhetsceller
    definition: "Et volum som fyller hele rommet uten hull eller overlapp når det gjentas med alle gittervektorene $\\vec{R}$."
  - term: Primitiv enhetscelle
    section: Enhetsceller
    definition: "En enhetscelle som inneholder <b>nøyaktig ett</b> gitterpunkt. Den har minst mulig volum, men speiler ofte ikke gitterets symmetri — derfor brukes den konvensjonelle cellen i praksis."
  - term: Konvensjonell enhetscelle
    section: Enhetsceller
    definition: "Den cellen man faktisk regner og tegner med, valgt fordi den viser symmetrien (typisk en kube). Den er som regel <b>ikke</b> primitiv: fcc rommer 4 gitterpunkter, bcc 2."
  - term: Wigner-Seitz-celle
    section: Enhetsceller
    definition: "Den primitive cellen rundt et gitterpunkt bestående av alle punkter som ligger nærmere <em>dette</em> gitterpunktet enn noe annet. Konstrueres ved å halvere vektorene til naboene med normalplan."
  - term: Koordinasjonstall
    section: Kubiske gitter
    definition: "Antall nærmeste naboer et gitterpunkt har. Enkel kubisk har 6, romsentrert kubisk 8 og flatesentrert kubisk 12 — jo høyere tall, jo tettere pakking."
  - term: Pakningsgrad
    section: Kubiske gitter
    definition: "Andelen av cellevolumet som fylles av harde kuler som akkurat berører hverandre: $0{,}52$ (sc), $0{,}68$ (bcc) og $0{,}74$ (fcc)."
  - term: Krystallsystem
    section: Symmetri
    definition: "En av de sju klassene av celleformer i tre dimensjoner (triklin, monoklin, ortorombisk, tetragonal, trigonal, heksagonal, kubisk), bestemt av forholdene mellom $a, b, c$ og vinklene $\\alpha, \\beta, \\gamma$. Sentrering av systemene gir totalt 14 Bravais-gitter."
  - term: Symmetrioperasjon
    section: Symmetri
    definition: "En operasjon som fører krystallen tilbake til en konfigurasjon som ikke kan skilles fra utgangspunktet. I dette kapitlet: translasjon, speiling, inversjon og rotasjon."
  - term: Translasjonssymmetri
    section: Symmetri
    definition: "Invarians under forskyvning med en gittervektor $\\vec{R}$. Dette er den definerende symmetrien til et krystallinsk stoff, og den som skiller krystallen fra et amorft materiale."
  - term: Speilsymmetri
    section: Symmetri
    definition: "Invarians under speiling om et plan (i 2D: en linje), betegnet $m$. Halvparten av strukturen bestemmer den andre halvparten."
  - term: Inversjonssymmetri
    section: Symmetri
    definition: "Invarians under $\\vec{r} \\to -\\vec{r}$ om et senterpunkt, betegnet $\\bar{1}$. I 2D er det det samme som en 180°-rotasjon; i 3D er det ikke det."
  - term: Rotasjonssymmetri
    section: Symmetri
    definition: "Invarians under rotasjon $360°/n$ om en akse. I et krystallgitter er bare $n = 1, 2, 3, 4, 6$ mulig — $n = 5$ og $n \\ge 7$ lar seg ikke kombinere med translasjonssymmetri."

