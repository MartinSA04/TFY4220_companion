symbols:
  # ── Gitter og struktur ──
  - { tex: "\\vec R", meaning: "Gittervektoren, $n_1\\vec a_1 + n_2\\vec a_2 + n_3\\vec a_3$ med heltallige $n_i$", unit: "Å", section: "Gitter og struktur", term: "Bravais-gitter", formula: gittervektor, note: "Ikke naboavstanden $R$ i krystallbindingen eller gasskonstanten $R$." }
  - { tex: "\\vec a_1,\\ \\vec a_2,\\ \\vec a_3", meaning: "De primitive gittervektorene", unit: "Å", section: "Gitter og struktur", term: "Primitive gittervektorer", formula: primitiv-celle-volum, note: "Valget er ikke entydig, men alle valg gir samme cellevolum." }
  - { tex: "a", meaning: "Gitterkonstanten, kantlengden i den konvensjonelle cellen", unit: "Å", section: "Gitter og struktur", term: "Gitterkonstant", formula: planavstand-kubisk, id: a, note: "Bare i enkel kubisk er den også naboavstanden. I atomkjeden er $a$ avstanden mellom like atomer." }
  - { tex: "N", meaning: "Antall atomer, i cellen eller i hele krystallen", section: "Gitter og struktur", note: "Formelen sier hva som telles: ionpar i $U_\\text{tot}$ for en ionekrystall, primitive celler i Debye-modellen og ledningselektroner i elektrongassen." }
  - { tex: "f", meaning: "Pakningsgraden, andelen av cellevolumet som fylles av harde kuler", section: "Gitter og struktur", term: "Pakningsgrad", formula: pakningsgrad, note: "$0{,}52$ (sc), $0{,}68$ (bcc) og $0{,}74$ (fcc). Ikke atomformfaktoren $f_j$." }
  - { tex: "n", meaning: "Tallet i en $n$-tellig rotasjonsakse, som dreier $360^\\circ/n$", section: "Gitter og struktur", term: "Rotasjonssymmetri", formula: rotasjonsbegrensning, note: "Bare $n = 1, 2, 3, 4$ og $6$ er mulig i et gitter. Vinkelen skrives $\\theta = 2\\pi/n$ i beviset." }
  - { tex: "(hkl)", meaning: "Miller-indeksene til en planfamilie", section: "Gitter og struktur", term: "Miller-indekser", id: hkl, note: "$\\{hkl\\}$ er familiene symmetrien gjør likeverdige, og $[uvw]$ er en retning. Indeksen $k$ er et heltall, ikke bølgevektoren." }
  - { tex: "d_{hkl}", meaning: "Avstanden mellom naboplan i familien $(hkl)$", unit: "Å", section: "Gitter og struktur", term: "Planavstand", formula: planavstand-G, id: dhkl, note: "$a/\\sqrt{h^2+k^2+l^2}$ i kubiske gitter. I Braggs lov skrives den $d$." }
  # ── Diffraksjon ──
  - { tex: "\\lambda", meaning: "Bølgelengden", unit: "Å", section: "Diffraksjon", formula: bragg, id: lambda, note: "$1{,}54$ Å fra et røntgenrør med kobberanode. Ikke parameteren $\\lambda$ i frastøtningen mellom ioner." }
  - { tex: "\\theta", meaning: "Bragg-vinkelen, mellom strålen og planet", unit: "°", section: "Diffraksjon", term: "Braggs lov", formula: bragg, id: theta, note: "Spredningsvinkelen mellom innfallende og spredt stråle er $2\\theta$. Ikke Debye-temperaturen $\\theta_D$." }
  - { tex: "n", meaning: "Refleksjonens orden i Braggs lov", section: "Diffraksjon", formula: bragg, note: "Et heltall. Ikke elektrontettheten $n$ eller antall fononer $n$." }
  - { tex: "\\vec k", meaning: "Bølgevektoren til strålingen, en gittersvingning eller et elektron", unit: "m⁻¹", section: "Diffraksjon", id: k, note: "Lengden er $k = 2\\pi/\\lambda$. Ikke Boltzmanns konstant $k_B$ eller Miller-indeksen $k$ i $(hkl)$." }
  - { tex: "\\vec Q", meaning: "Spredningsvektoren, $\\vec k_f - \\vec k_i$", unit: "m⁻¹", section: "Diffraksjon", term: "Spredningsvektor", formula: spredningsvektor, note: "$\\vec k_i$ er den innfallende og $\\vec k_f$ den spredte bølgevektoren, like lange når spredningen er elastisk." }
  - { tex: "\\vec G", meaning: "Resiprok gittervektor, $m_1\\vec b_1 + m_2\\vec b_2 + m_3\\vec b_3$ med heltallige $m_i$", unit: "m⁻¹", section: "Diffraksjon", term: "Resiprokt gitter", formula: laue-betingelse, id: g, note: "$\\vec b_i$ er de primitive resiproke vektorene, og $\\vec G_{hkl}$ står normalt på planene $(hkl)$." }
  - { tex: "\\rho(\\vec r)", meaning: "Spredningstettheten", section: "Diffraksjon", term: "Spredningstetthet", formula: spredningsamplitude, note: "Elektrontettheten for røntgen, kjernene for nøytroner. Ikke resistiviteten $\\rho$." }
  - { tex: "S_{hkl}", meaning: "Strukturfaktoren, summen over atomene i basisen", section: "Diffraksjon", term: "Strukturfaktor", formula: strukturfaktor, id: shkl, note: "Amplituden fra krystallen er $F = NS_{hkl}$, og $I \\propto |S_{hkl}|^2$. $(x_j, y_j, z_j)$ er posisjonen til atom $j$ i relative koordinater." }
  - { tex: "f_j", meaning: "Atomformfaktoren, spredningsamplituden fra atom $j$", section: "Diffraksjon", term: "Atomformfaktor", formula: formfaktor, note: "Lik antall elektroner $Z$ ved $\\vec Q = 0$. Ikke pakningsgraden $f$." }
  # ── Krystallbinding ──
  - { tex: "r", meaning: "Avstanden mellom to atomer", unit: "Å", section: "Krystallbinding", formula: lennard-jones, note: "Ikke $R$, den nærmeste naboavstanden i krystallen. I pakningsgraden er $r$ kuleradien." }
  - { tex: "U(r),\\ U_\\text{tot}", meaning: "Parpotensialet mellom to atomer, og den totale energien til krystallen", unit: "eV", section: "Krystallbinding", formula: lennard-jones-krystall, note: "Ved likevekt er $-U_\\text{tot}$ kohesjonsenergien, for en ionekrystall gitterenergien." }
  - { tex: "R", meaning: "Nærmeste naboavstand i krystallen", unit: "Å", section: "Krystallbinding", formula: madelung-energi, note: "$R_0$ er avstanden i likevekt, $2{,}82$ Å i NaCl. Ikke gittervektoren $\\vec R$." }
  - { tex: "\\varepsilon", meaning: "Dybden av brønnen i Lennard-Jones-potensialet", unit: "eV", section: "Krystallbinding", term: "Lennard-Jones-potensialet", formula: lennard-jones, note: "$0{,}0104$ eV for argon. Ikke energien $\\varepsilon$ til et elektron." }
  - { tex: "\\sigma", meaning: "Avstanden der Lennard-Jones-potensialet er null", unit: "Å", section: "Krystallbinding", formula: lennard-jones, note: "$3{,}40$ Å for argon. Ikke ledningsevnen $\\sigma$." }
  - { tex: "\\alpha", meaning: "Madelung-konstanten", section: "Krystallbinding", term: "Madelung-konstant", formula: madelung-konstant, id: alpha, note: "$1{,}7476$ for NaCl. Ikke cellevinkelen $\\alpha$ eller polariserbarheten $\\alpha$ i van der Waals-bindingen." }
  - { tex: "\\lambda", meaning: "Styrken på frastøtningen $\\lambda e^{-R/\\rho}$ mellom nærmeste naboer", unit: "eV", section: "Krystallbinding", formula: madelung-energi, note: "En empirisk parameter. Ikke bølgelengden $\\lambda$." }
  - { tex: "\\rho", meaning: "Rekkevidden til frastøtningen mellom ionene", unit: "Å", section: "Krystallbinding", formula: madelung-likevekt, note: "$0{,}32$ Å i NaCl, omtrent en tidel av $R_0$. Ikke resistiviteten $\\rho$." }
  - { tex: "q", meaning: "Ladningen til et ion", unit: "C", section: "Krystallbinding", formula: madelung-energi, note: "For NaCl er $q^2/4\\pi\\varepsilon_0 = 14{,}40$ eV·Å." }
  # ── Fononer og varmekapasitet ──
  - { tex: "u_n", meaning: "Utsvinget til atom $n$ fra likevekt", section: "Fononer og varmekapasitet", note: "Med to atomtyper er $u_n$ og $v_n$ utsvingene til de to atomene i celle $n$. $v_n$ er ikke en hastighet." }
  - { tex: "M", meaning: "Massen til et atom i kjeden", unit: "kg", section: "Fononer og varmekapasitet", formula: dispersjon-enatomig, note: "Med to atomtyper er $M_1 > M_2$. Ikke elektronmassen $m$." }
  - { tex: "C", meaning: "Kraftkonstanten mellom nærmeste naboer, $U''(a)$", unit: "N/m", section: "Fononer og varmekapasitet", term: "Harmonisk tilnærming", formula: dispersjon-enatomig, id: c, note: "Ikke varmekapasiteten $C_V$, som i elektrongassen bare skrives $C$. Kraftkonstanten skrives også $K$ eller $\\gamma$." }
  - { tex: "\\omega", meaning: "Frekvensen til en svingning", unit: "rad/s", section: "Fononer og varmekapasitet", term: "Dispersjonsrelasjon", formula: dispersjon-enatomig, id: omega, note: "Energien til ett fonon er $\\hbar\\omega$." }
  - { tex: "v", meaning: "Lydhastigheten, lik fasehastigheten $\\omega/k$ for lange bølger", unit: "m/s", section: "Fononer og varmekapasitet", formula: lydhastighet, note: "Debye-modellen bruker $\\omega = vk$ for alle $k$. Ikke farten $\\vec v$ til et elektron." }
  - { tex: "v_g", meaning: "Gruppehastigheten, $\\mathrm d\\omega/\\mathrm dk$", unit: "m/s", section: "Fononer og varmekapasitet", term: "Gruppehastighet", formula: lydhastighet, note: "Null på sonegrensen, der bølgen står stille." }
  - { tex: "n,\\ \\langle n\\rangle", meaning: "Antall fononer i en svingning, og middelet ved temperaturen $T$", section: "Fononer og varmekapasitet", term: "Fonon", formula: planck-fordeling, note: "Energien er $(n + \\tfrac12)\\hbar\\omega$. Ikke elektrontettheten $n$." }
  - { tex: "U", meaning: "Den indre energien", unit: "J", section: "Fononer og varmekapasitet", note: "$3Nk_BT$ for gitteret ved høy $T$, og $\\tfrac35 N\\varepsilon_F$ for elektrongassen ved $T = 0$." }
  - { tex: "C_V", meaning: "Varmekapasiteten, $(\\partial U/\\partial T)_V$", unit: "J/K", section: "Fononer og varmekapasitet", term: "Dulong-Petits lov", formula: debye-t3, id: cv, note: "$3R = 24{,}9$ J/(mol·K) per mol ved høy $T$. Ikke kraftkonstanten $C$." }
  - { tex: "\\theta_E", meaning: "Einstein-temperaturen, $\\hbar\\omega_E/k_B$", unit: "K", section: "Fononer og varmekapasitet", term: "Einstein-modellen", formula: einstein-varmekapasitet, note: "$\\omega_E$ er den ene frekvensen alle $3N$ svingninger har i Einstein-modellen." }
  - { tex: "\\omega_D", meaning: "Debye-frekvensen, grensefrekvensen i Debye-modellen", unit: "rad/s", section: "Fononer og varmekapasitet", term: "Debye-modellen", formula: debye-temperatur, note: "Satt slik at hver polarisasjon får $N$ svingninger." }
  - { tex: "\\theta_D", meaning: "Debye-temperaturen, $\\hbar\\omega_D/k_B$", unit: "K", section: "Fononer og varmekapasitet", term: "Debye-temperatur", formula: debye-temperatur, id: theta-d, note: "343 K for kobber og 2230 K for diamant. Skrives også $\\Theta_D$. Ikke Bragg-vinkelen $\\theta$." }
  - { tex: "D(\\omega)", meaning: "Tilstandstettheten, antall svingninger per frekvensenhet", unit: "s", section: "Fononer og varmekapasitet", term: "Tilstandstetthet", formula: debye-tilstandstetthet, note: "Divergerer der gruppehastigheten er null." }
  - { tex: "L", meaning: "Lengden av kjeden eller kanten av krystallen", unit: "m", section: "Fononer og varmekapasitet", formula: tillatte-k, note: "$L = Na$ for en kjede av $N$ atomer. Ikke Lorenz-tallet $L$." }
  # ── Frie elektroner ──
  - { tex: "n", meaning: "Elektrontettheten, $N/V$", unit: "m⁻³", section: "Frie elektroner", formula: fermi-bolgevektor, id: n, note: "$8{,}47 \\cdot 10^{28}$ m⁻³ i kobber. Ikke refleksjonsordenen $n$ i Braggs lov." }
  - { tex: "\\tau", meaning: "Relaksasjonstiden, middeltiden mellom to kollisjoner", unit: "s", section: "Frie elektroner", term: "Relaksasjonstid", formula: drude-ledningsevne, id: tau, note: "$2{,}5 \\cdot 10^{-14}$ s i kobber ved romtemperatur." }
  - { tex: "\\vec E", meaning: "Elektrisk felt", unit: "V/m", section: "Frie elektroner", formula: drude-ledningsevne, note: "$E_y$ er Hall-feltet. Ikke energien $E$ til et foton eller en svingning." }
  - { tex: "\\langle\\vec v\\rangle", meaning: "Drifthastigheten, $-e\\tau\\vec E/m$", unit: "m/s", section: "Frie elektroner", formula: drude-ledningsevne, note: "I varmeledningen er $\\langle v\\rangle$ middelfarten i en klassisk gass, $\\sqrt{8k_BT/\\pi m}$." }
  - { tex: "\\sigma", meaning: "Ledningsevnen, $ne^2\\tau/m$", unit: "(Ω m)⁻¹", section: "Frie elektroner", formula: drude-ledningsevne, id: sigma, note: "Ikke avstanden $\\sigma$ i Lennard-Jones-potensialet." }
  - { tex: "\\rho", meaning: "Resistiviteten, $1/\\sigma$", unit: "Ω m", section: "Frie elektroner", note: "$1{,}7 \\cdot 10^{-8}$ Ω m i kobber ved romtemperatur. Ikke spredningstettheten $\\rho(\\vec r)$." }
  - { tex: "R_H", meaning: "Hall-koeffisienten, $E_y/j_xB_z$", unit: "m³/C", section: "Frie elektroner", term: "Hall-effekten", formula: hall-koeffisient, id: rh, note: "$-1/ne$ for elektroner. $B_z$ er magnetfeltet og $j_x$ strømtettheten." }
  - { tex: "K", meaning: "Varmeledningsevnen", unit: "W/(m·K)", section: "Frie elektroner", formula: varmeledningsevne, note: "$K = \\tfrac13 Cv\\ell$, med $C$ varmekapasiteten per volum." }
  - { tex: "L", meaning: "Lorenz-tallet, $K/\\sigma T$", unit: "W Ω/K²", section: "Frie elektroner", term: "Wiedemann-Franz’ lov", formula: wiedemann-franz, note: "$2{,}44 \\cdot 10^{-8}$ W Ω/K² fra fri-elektronmodellen. Ikke lengden $L$." }
  - { tex: "\\ell", meaning: "Den frie veilengden, strekningen mellom to kollisjoner", unit: "m", section: "Frie elektroner", term: "Fri veilengde", formula: varmeledningsevne, note: "$v_F\\tau = 39$ nm i kobber ved romtemperatur." }
  - { tex: "\\varepsilon", meaning: "Energien til en elektrontilstand", unit: "eV", section: "Frie elektroner", formula: elektron-tilstandstetthet, note: "$\\hbar^2k^2/2m$ for frie elektroner. Eksamensoppgavene skriver ofte $E$. Ikke dybden $\\varepsilon$ av brønnen i Lennard-Jones-potensialet." }
  - { tex: "f(\\varepsilon)", meaning: "Fermi-Dirac-fordelingen, sannsynligheten for at en tilstand er besatt", section: "Frie elektroner", term: "Fermi-Dirac-fordelingen", formula: fermi-dirac, note: "$\\mu$ er det kjemiske potensialet, lik $\\varepsilon_F$ ved $T = 0$." }
  - { tex: "\\varepsilon_F", meaning: "Fermi-energien", unit: "eV", section: "Frie elektroner", term: "Fermi-energi", formula: fermi-energi, id: ef, note: "$7{,}0$ eV i kobber. Skrives også $E_F$." }
  - { tex: "k_F", meaning: "Fermi-bølgevektoren, radien i Fermi-kula", unit: "m⁻¹", section: "Frie elektroner", term: "Fermi-kule", formula: fermi-bolgevektor, id: kf }
  - { tex: "v_F", meaning: "Fermi-hastigheten, $\\hbar k_F/m$", unit: "m/s", section: "Frie elektroner", formula: fermi-hastighet, note: "$1{,}57 \\cdot 10^6$ m/s i kobber." }
  - { tex: "T_F", meaning: "Fermi-temperaturen, $\\varepsilon_F/k_B$", unit: "K", section: "Frie elektroner", term: "Fermi-temperatur", formula: fermi-hastighet, note: "$82\\,000$ K i kobber." }
  - { tex: "D(\\varepsilon)", meaning: "Tilstandstettheten for elektronene, antall tilstander per energienhet", unit: "eV⁻¹", section: "Frie elektroner", term: "Tilstandstetthet", formula: elektron-tilstandstetthet, note: "$3N/2\\varepsilon_F$ ved Fermi-energien, med begge spinnretninger." }
  - { tex: "C_\\text{el}", meaning: "Varmekapasiteten til elektrongassen", unit: "J/K", section: "Frie elektroner", formula: elektron-varmekapasitet, note: "Rundt én prosent av den klassiske verdien $\\tfrac32 Nk_B$ ved romtemperatur." }
  - { tex: "\\gamma", meaning: "Koeffisienten til elektronleddet i $C = \\gamma T + AT^3$", unit: "mJ/(mol·K²)", section: "Frie elektroner", formula: elektron-varmekapasitet, note: "$0{,}695$ mJ/(mol·K²) målt for kobber. $AT^3$ er gitterleddet. Ikke cellevinkelen $\\gamma$." }
  # ── Laboratorieøvingene ──
  - { tex: "E", meaning: "Energien til et røntgenfoton, $hc/\\lambda$", unit: "keV", section: "Laboratorieøvingene", formula: fotonenergi, note: "Ikke det elektriske feltet $\\vec E$." }
  - { tex: "t", meaning: "Krystallittstørrelsen i Scherrer-formelen", unit: "Å", section: "Laboratorieøvingene", formula: scherrer }
  - { tex: "\\beta", meaning: "Bredden av en topp ved halv høyde, på $2\\theta$-skalaen", unit: "rad", section: "Laboratorieøvingene", formula: scherrer }
  - { tex: "V", meaning: "Akselerasjonsspenningen i elektronmikroskopet", unit: "kV", section: "Laboratorieøvingene", formula: elektron-bolgelengde, note: "60 til 500 kV i et TEM. Ikke volumet $V$ eller indeksen $V$ i soneaksen $[UVW]$." }
  - { tex: "R_{hkl}", meaning: "Avstanden fra sentrum til refleksen $hkl$ på diffraksjonsbildet", unit: "mm", section: "Laboratorieøvingene", formula: kameralikning, note: "Måles i mm eller piksler på bildet. Ikke naboavstanden $R$." }
  - { tex: "L", meaning: "Kameralengden i elektronmikroskopet", unit: "m", section: "Laboratorieøvingene", term: "Kameralengde", formula: kameralikning, id: kameralengde, note: "Bare produktet $\\lambda L$ inngår. Ikke kjedelengden $L$ eller Lorenz-tallet $L$." }
  - { tex: "[UVW]", meaning: "Soneaksen, retningen strålen går gjennom krystallen", section: "Laboratorieøvingene", term: "Soneakse", formula: soneakse, id: uvw }
  - { tex: "\\varphi", meaning: "Vinkelen mellom to reflekser, sett fra sentrum av diffraksjonsbildet", unit: "°", section: "Laboratorieøvingene", formula: vinkel-reflekser }
  - { tex: "\\sigma", meaning: "Bølgetallet, $1/\\lambda$", unit: "cm⁻¹", section: "Laboratorieøvingene", term: "Bølgetall", formula: bolgetall, id: sigma-bolgetall, note: "Skrivemåten i FTIR-laben. Ikke ledningsevnen $\\sigma$ eller avstanden $\\sigma$ i Lennard-Jones-potensialet." }
  - { tex: "\\nu", meaning: "Frekvensen, $\\omega/2\\pi$", unit: "Hz", section: "Laboratorieøvingene", formula: bolgetall }
  - { tex: "I(\\nu)", meaning: "Effekten et svart legeme stråler ut per flate, romvinkel og frekvensenhet", unit: "W m⁻² sr⁻¹ Hz⁻¹", section: "Laboratorieøvingene", term: "Svart legeme", formula: planck-straling, note: "Ikke intensiteten $I$ til en refleks i diffraksjon." }
  - { tex: "\\sigma_\\text{SB}", meaning: "Stefan-Boltzmanns konstant", unit: "W m⁻² K⁻⁴", section: "Laboratorieøvingene", term: "Stefan-Boltzmanns lov", formula: stefan-boltzmann, note: "$5{,}67 \\cdot 10^{-8}$ W m⁻² K⁻⁴. Laboppgaven skriver den $\\sigma$." }
  - { tex: "\\mu", meaning: "Den reduserte massen til et atompar", unit: "kg", section: "Laboratorieøvingene", term: "Redusert masse", formula: redusert-masse, note: "Ikke det kjemiske potensialet $\\mu$." }
  # ── Konstanter ──
  - { tex: "k_B", meaning: "Boltzmanns konstant", unit: "J/K", section: "Konstanter", id: kb, note: "$k_BT = 26$ meV ved romtemperatur. Ikke bølgevektoren $k$." }
  - { tex: "\\hbar", meaning: "Redusert Plancks konstant, $h/2\\pi$", unit: "J·s", section: "Konstanter", note: "$1{,}05 \\cdot 10^{-34}$ J·s." }
  - { tex: "e", meaning: "Elementærladningen", unit: "C", section: "Konstanter", note: "$1{,}60 \\cdot 10^{-19}$ C. Elektronet har ladning $-e$." }
  - { tex: "m", meaning: "Elektronmassen", unit: "kg", section: "Konstanter", note: "$9{,}11 \\cdot 10^{-31}$ kg. I $k = 2\\pi m/L$ og $2\\cos\\theta = m$ er $m$ et heltall." }
  - { tex: "R", meaning: "Gasskonstanten, $N_Ak_B$", unit: "J/(mol·K)", section: "Konstanter", note: "$8{,}31$ J/(mol·K). Ikke naboavstanden $R$." }
