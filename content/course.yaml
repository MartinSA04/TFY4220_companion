formulas:
  - id: gittervektor
    section: Gitter og basis
    tex: "\\vec{R} = n_1\\vec{a}_1 + n_2\\vec{a}_2 + n_3\\vec{a}_3"
    label: "Gittervektor. $n_i$ er <b>heltall</b> og $\\vec{a}_i$ de primitive gittervektorene. Mengden av alle $\\vec{R}$ <em>er</em> Bravais-gitteret."
  - id: basis-posisjon
    section: Gitter og basis
    tex: "\\vec{r}_j = x_j\\vec{a}_1 + y_j\\vec{a}_2 + z_j\\vec{a}_3"
    label: "Posisjonen til atom $j$ i basisen, oppgitt i <b>relative</b> koordinater $0 \\le x_j, y_j, z_j < 1$."
  - id: primitiv-celle-volum
    section: Enhetsceller og pakning
    tex: "V_c = \\left|\\vec{a}_1 \\cdot (\\vec{a}_2 \\times \\vec{a}_3)\\right|"
    label: "Volumet av den primitive enhetscellen. Alle valg av primitiv celle gir <b>samme</b> volum."
  - id: atomer-per-celle
    section: Enhetsceller og pakning
    tex: "N = N_\\mathrm{i} + \\dfrac{N_\\mathrm{f}}{2} + \\dfrac{N_\\mathrm{k}}{4} + \\dfrac{N_\\mathrm{h}}{8}"
    label: "Antall atomer per enhetscelle ved deling med naboceller, i en celle med <b>rette vinkler</b>: indre (i) telles helt, flate (f) halvt, kant (k) kvart og hjørne (h) åttendedels. Ellers teller du den andelen av en hel omdreining hvert hjørne dekker."
  - id: pakningsgrad
    section: Enhetsceller og pakning
    tex: "f = \\dfrac{N \\cdot \\tfrac{4}{3}\\pi r^3}{V_\\text{celle}}"
    label: "Pakningsgrad (<em>packing fraction</em>): andelen av cellevolumet fylt av harde kuler med radius $r$, der $N$ er antall atomer i cellen. I lukket form $\\pi/6$ (sc), $\\pi\\sqrt3/8$ (bcc) og $\\pi\\sqrt2/6$ (fcc)."
  - id: naboavstand-fcc
    section: Enhetsceller og pakning
    tex: "d_\\text{fcc} = \\dfrac{a}{\\sqrt{2}}, \\qquad r = \\dfrac{a\\sqrt{2}}{4}"
    label: "Nærmeste naboavstand og hardkuleradius i et flatesentrert kubisk gitter med gitterkonstant $a$. Kulene berører langs <b>flatediagonalen</b>."
  - id: naboavstand-bcc
    section: Enhetsceller og pakning
    tex: "d_\\text{bcc} = \\dfrac{a\\sqrt{3}}{2}, \\qquad r = \\dfrac{a\\sqrt{3}}{4}"
    label: "Nærmeste naboavstand og hardkuleradius i et romsentrert kubisk gitter. Kulene berører langs <b>romdiagonalen</b>."
  - id: primitiv-bcc
    section: Primitive celler i bcc og fcc
    tex: "\\vec{a}_1 = \\tfrac{a}{2}(\\hat{x}{+}\\hat{y}{-}\\hat{z}), \\quad \\vec{a}_2 = \\tfrac{a}{2}({-}\\hat{x}{+}\\hat{y}{+}\\hat{z}), \\quad \\vec{a}_3 = \\tfrac{a}{2}(\\hat{x}{-}\\hat{y}{+}\\hat{z})"
    label: "Primitive gittervektorer for bcc, fra et hjørne til tre av romsentrene. Cellen er et romboeder med volum $a^3/2$, halvparten av kuben."
  - id: primitiv-fcc
    section: Primitive celler i bcc og fcc
    tex: "\\vec{a}_1 = \\tfrac{a}{2}(\\hat{x}{+}\\hat{y}), \\quad \\vec{a}_2 = \\tfrac{a}{2}(\\hat{y}{+}\\hat{z}), \\quad \\vec{a}_3 = \\tfrac{a}{2}(\\hat{z}{+}\\hat{x})"
    label: "Primitive gittervektorer for fcc, fra et hjørne til de tre nærmeste flatesentrene. Cellen er et romboeder med volum $a^3/4$."
  - id: rotasjonsbegrensning
    section: Symmetri
    tex: "2\\cos\\theta = m, \\qquad m \\in \\mathbb{Z}"
    label: "Krystallografisk begrensning. En $n$-tellig akse er bare forenlig med translasjonssymmetri når $2\\cos(2\\pi/n)$ er et heltall. Siden $|2\\cos\\theta| \\le 2$ er $m \\in \\{-2, -1, 0, 1, 2\\}$, altså $n = 1, 2, 3, 4, 6$."
  - id: planavstand-kubisk
    section: Retninger og planavstand
    tex: "d_{hkl} = \\dfrac{a}{\\sqrt{h^2 + k^2 + l^2}}"
    label: "Avstanden mellom naboplan i familien $(hkl)$ i et kubisk gitter med gitterkonstant $a$. I kubiske gitter står retningen $[hkl]$ normalt på planet $(hkl)$."
  - id: bragg
    section: Braggs lov
    tex: "2d\\sin\\theta = n\\lambda"
    label: "Braggs lov. Konstruktiv refleksjon fra en planfamilie med avstand $d$; vinkelen $\\theta$ måles fra <b>planet</b>, ikke fra normalen, og heltallet $n$ er refleksjonens orden. Siden $\\sin\\theta \\le 1$ finnes bare et endelig antall ordener."
  - id: spredningsvektor
    section: Spredningsvektoren
    tex: "\\vec{Q} = \\vec{k}_f - \\vec{k}_i, \\qquad |\\vec{Q}| = \\dfrac{4\\pi}{\\lambda}\\sin\\theta"
    label: "Spredningsvektoren. Ved elastisk spredning er $|\\vec{k}_f| = |\\vec{k}_i| = 2\\pi/\\lambda$, og $2\\theta$ er vinkelen mellom innfallende og spredt stråle."
  - id: spredningsamplitude
    section: Spredningsvektoren
    tex: "F(\\vec{Q}) = \\int \\rho(\\vec{r})\\, e^{i\\vec{Q}\\cdot\\vec{r}}\\, \\mathrm{d}V"
    label: "Spredningsamplituden: bidraget fra hvert volumelement, summert med faseforskjellen $\\vec{Q}\\cdot\\vec{r}$. Dette er Fourier-transformen av spredningstettheten. Detektoren måler intensiteten $I \\propto |F|^2$, så fasen går tapt."
  - id: fourier-tetthet
    section: Det resiproke gitteret
    tex: "\\rho(\\vec{r}) = \\sum_{\\vec{G}} \\rho_{\\vec{G}}\\, e^{i\\vec{G}\\cdot\\vec{r}}"
    label: "En gitterperiodisk tetthet skrevet som Fourier-rekke. Bare bølgevektorer på det resiproke gitteret bidrar; alle andre bryter periodisiteten $\\rho(\\vec{r} + \\vec{R}) = \\rho(\\vec{r})$."
  - id: resiproke-vektorer
    section: Det resiproke gitteret
    tex: "\\vec{b}_1 = 2\\pi\\,\\dfrac{\\vec{a}_2 \\times \\vec{a}_3}{\\vec{a}_1 \\cdot (\\vec{a}_2 \\times \\vec{a}_3)} \\;\\; \\text{(og syklisk)}, \\qquad \\vec{a}_i \\cdot \\vec{b}_j = 2\\pi\\,\\delta_{ij}"
    label: "De primitive vektorene for det resiproke gitteret. $\\vec{b}_1$ står normalt på både $\\vec{a}_2$ og $\\vec{a}_3$, og lengden skalerer som $2\\pi$ delt på en gitteravstand: et stort direkte gitter gir et lite resiprokt."
  - id: laue-betingelse
    section: Diffraksjonsbetingelsen
    tex: "\\vec{Q} = \\vec{G}"
    label: "Diffraksjonsbetingelsen (Laue): sterk spredning bare når spredningsvektoren treffer et resiprokt gitterpunkt. Da er $F = V\\rho_{\\vec{G}}$; ellers er $F \\approx 0$. Ekvivalent med Braggs lov."
  - id: planavstand-G
    section: Diffraksjonsbetingelsen
    tex: "d_{hkl} = \\dfrac{2\\pi}{|\\vec{G}_{hkl}|}, \\qquad \\vec{G}_{hkl} = h\\vec{b}_1 + k\\vec{b}_2 + l\\vec{b}_3"
    label: "$\\vec{G}_{hkl}$ står normalt på planfamilien $(hkl)$, og den korteste slike gir planavstanden. Gjelder i alle gitre; i kubiske reduseres den til $d_{hkl} = a/\\sqrt{h^2+k^2+l^2}$."

  - id: pulver-kubisk
    section: Diffraksjonsmetoder
    tex: "\\sin^2\\theta = \\dfrac{\\lambda^2}{4a^2}\\left(h^2 + k^2 + l^2\\right)"
    label: "Ringvinklene i et pulverbilde av et kubisk gitter, fra Braggs lov med $d_{hkl} = a/\\sqrt{h^2+k^2+l^2}$. Ringene ligger etter $h^2+k^2+l^2$, og hvilke som faktisk vises, avgjør strukturfaktoren."
  - id: strukturfaktor
    section: Strukturfaktoren
    tex: "S_{hkl} = \\sum_j f_j\\, e^{2\\pi i (hx_j + ky_j + lz_j)}"
    label: "Strukturfaktoren: summen over atomene i basisen, hvert med sin atomformfaktor $f_j$ og fasen fra posisjonen $(x_j, y_j, z_j)$ i relative koordinater. Amplituden fra hele krystallen er $N$ celler ganger $S$, og intensiteten er $I \\propto |S_{hkl}|^2$."
  - id: formfaktor
    section: Strukturfaktoren
    tex: "f_j(\\vec{Q}) = \\int \\rho_j(\\vec{r})\\, e^{i\\vec{Q}\\cdot\\vec{r}}\\, \\mathrm{d}V"
    label: "Atomformfaktoren: Fourier-transformen av elektrontettheten i ett atom. Den er lik antall elektroner for $\\vec Q = 0$ og avtar med økende $|\\vec Q|$, så reflekser ved store vinkler er svakere."
  - id: strukturfaktor-bcc
    section: Systematiske utslukkinger
    tex: "\\begin{aligned} S_{hkl} &= f\\left[1 + e^{i\\pi(h+k+l)}\\right] \\\\ &= \\begin{cases} 2f & h+k+l \\text{ partall} \\\\ 0 & h+k+l \\text{ oddetall} \\end{cases} \\end{aligned}"
    label: "Strukturfaktoren for bcc regnet i den konvensjonelle kuben, med like atomer i $(0,0,0)$ og $(\\tfrac12,\\tfrac12,\\tfrac12)$. Utvalgsregel: bare reflekser med $h+k+l$ partall."
  - id: strukturfaktor-fcc
    section: Systematiske utslukkinger
    tex: "S_{hkl} = f\\bigl[1 + e^{i\\pi(h+k)} \\allowbreak + e^{i\\pi(h+l)} + e^{i\\pi(k+l)}\\bigr]"
    label: "Strukturfaktoren for fcc i den konvensjonelle kuben, med atomer i $(0,0,0)$, $(\\tfrac12,\\tfrac12,0)$, $(\\tfrac12,0,\\tfrac12)$ og $(0,\\tfrac12,\\tfrac12)$. Den er $4f$ når $h, k, l$ er alle partall eller alle oddetall, og $0$ ellers."
  - id: brillouin-betingelse
    section: Brillouin-soner
    tex: "\\vec{k}\\cdot\\tfrac{1}{2}\\vec{G} = \\left(\\tfrac{1}{2}G\\right)^2"
    label: "Diffraksjonsbetingelsen $\\vec Q = \\vec G$ skrevet om for den innfallende bølgevektoren. Den er oppfylt for alle $\\vec k$ som ender på planet som halverer $\\vec G$ normalt, og disse planene er grensene til Brillouin-sonene."

  - id: lennard-jones
    section: Van der Waals-binding
    tex: "U(r) = 4\\varepsilon\\left[\\left(\\dfrac{\\sigma}{r}\\right)^{12} - \\left(\\dfrac{\\sigma}{r}\\right)^{6}\\right]"
    label: "Lennard-Jones-potensialet mellom to edelgassatomer. Leddet $-r^{-6}$ er tiltrekningen mellom induserte dipoler, leddet $+r^{-12}$ er frastøtningen når elektronskyene overlapper (Pauli-prinsippet). $\\varepsilon$ er dybden av brønnen, $\\sigma$ er avstanden der $U = 0$, og minimum ligger i $r = 2^{1/6}\\sigma$."
  - id: lennard-jones-krystall
    section: Van der Waals-binding
    tex: "U_\\text{tot} = 2N\\varepsilon\\left[A_{12}\\left(\\dfrac{\\sigma}{R}\\right)^{12} - A_6\\left(\\dfrac{\\sigma}{R}\\right)^{6}\\right]"
    label: "Total energi for $N$ edelgassatomer, med $R$ som nærmeste naboavstand. Gittersummene $A_n = \\sum_j p_j^{-n}$ over avstandene $p_j R$ til de andre atomene avhenger bare av gittertypen; for fcc er $A_{12} = 12{,}13$ og $A_6 = 14{,}45$. Likevekt ved $R_0 = 1{,}09\\,\\sigma$, der $U_\\text{tot} = -8{,}6\\,N\\varepsilon$."
  - id: madelung-energi
    section: Ionisk binding
    tex: "U_\\text{tot} = N\\left(z\\lambda\\, e^{-R/\\rho} - \\dfrac{\\alpha q^2}{4\\pi\\varepsilon_0 R}\\right)"
    label: "Total energi for en ionekrystall med $N$ ionpar og nærmeste naboavstand $R$. Frastøtningen $\\lambda e^{-R/\\rho}$ tas med for de $z$ nærmeste naboene, med $\\lambda$ og $\\rho$ som empiriske parametere. Coulomb-leddet summerer over hele krystallen gjennom Madelung-konstanten $\\alpha$, og kalles alene Madelung-energien."
  - id: madelung-konstant
    section: Ionisk binding
    tex: "\\alpha = \\sum_j \\dfrac{(\\pm)}{p_{ij}}"
    label: "Madelung-konstanten: summen over alle andre ioner $j$ i krystallen, med $p_{ij}R$ som avstanden fra referanseionet $i$, pluss for motsatt ladning og minus for samme. Den er $1{,}7476$ for NaCl, $1{,}7627$ for CsCl og $1{,}6381$ for ZnS. Rekken konvergerer bare når den summeres i nøytrale grupper."
  - id: madelung-likevekt
    section: Ionisk binding
    tex: "U_\\text{tot}(R_0) = -\\dfrac{N\\alpha q^2}{4\\pi\\varepsilon_0 R_0}\\left(1 - \\dfrac{\\rho}{R_0}\\right)"
    label: "Energien til en ionekrystall ved likevektsavstanden $R_0$, fra $\\mathrm{d}U_\\text{tot}/\\mathrm{d}R = 0$. Frastøtningen reduserer Madelung-energien med andelen $\\rho/R_0 \\approx 0{,}1$. For NaCl gir $R_0 = 2{,}82$ Å og $\\rho = 0{,}32$ Å $7{,}9$ eV per ionpar, som målt."

  - id: dispersjon-enatomig
    section: Gittersvingninger
    tex: "\\omega(k) = 2\\sqrt{\\dfrac{C}{M}}\\,\\left|\\sin\\dfrac{ka}{2}\\right|"
    label: "Dispersjonsrelasjonen for en kjede av atomer med masse $M$ i avstand $a$, med kraftkonstant $C$ mellom nærmeste naboer. Kraftkonstanten skrives også $K$ eller $\\gamma$. $\\omega$ er periodisk i $k$ med periode $2\\pi/a$, så alle svingninger ligger i første Brillouin-sone $-\\pi/a < k \\le \\pi/a$, og maksimum $2\\sqrt{C/M}$ er på sonegrensen."
  - id: lydhastighet
    section: Gittersvingninger
    tex: "v = \\dfrac{\\omega}{k} = a\\sqrt{\\dfrac{C}{M}}, \\qquad v_g = \\dfrac{\\mathrm d\\omega}{\\mathrm dk}"
    label: "Lydhastigheten i kjeden, fra grensen $ka \\ll 1$ der $\\omega \\approx vk$, og gruppehastigheten, som er hastigheten til et signal. For lange bølger er de like; på sonegrensen $k = \\pi/a$ er $v_g = 0$ og bølgen står stille."
  - id: dispersjon-toatomig
    section: Gittersvingninger
    tex: "\\begin{aligned} &\\omega^2 = C\\frac{M_1 + M_2}{M_1 M_2}\\times \\\\ &\\bigl[1 \\pm \\sqrt{1 - \\tfrac{4M_1 M_2}{(M_1 + M_2)^2}\\sin^2\\!\\tfrac{ka}{2}}\\bigr] \\end{aligned}"
    label: "Dispersjonsrelasjonen for en kjede med to atomtyper $M_1 > M_2$ per celle og samme kraftkonstant $C$. Plusstegnet gir den optiske grenen, som starter på $\\omega^2 = 2C(1/M_1 + 1/M_2)$ ved $k = 0$; minustegnet gir den akustiske, som går som $\\omega \\propto k$. På sonegrensen er $\\omega^2 = 2C/M_1$ og $2C/M_2$, og mellom dem er det et gap uten løsninger."
  - id: fonon-energi
    section: Fononer
    tex: "\\begin{aligned} E_n(k) &= \\left(n + \\tfrac12\\right)\\hbar\\omega(k) \\\\ \\vec p &= \\hbar\\vec k \\end{aligned}"
    label: "Energien i gittersvingningen med bølgevektor $k$ og $n$ fononer, med nullpunktsenergien $\\tfrac12\\hbar\\omega$, og krystallimpulsen til et fonon. Fononer er bosoner, så $n$ kan være vilkårlig stor. Den fysiske impulsen til en svingning med $k \\ne 0$ er null."

  - id: planck-fordeling
    section: Varmekapasitet
    tex: "\\langle n \\rangle = \\dfrac{1}{e^{\\hbar\\omega/k_BT} - 1}"
    label: "Planck-fordelingen: middelantallet fononer i en svingning med frekvens $\\omega$ ved temperaturen $T$. Middelenergien er $\\hbar\\omega\\langle n \\rangle$, som er $k_BT$ for $\\hbar\\omega \\ll k_BT$ og eksponentielt liten for $\\hbar\\omega \\gg k_BT$."
  - id: einstein-varmekapasitet
    section: Varmekapasitet
    tex: "\\begin{aligned} C_V &= 3Nk_B\\,\\frac{x^2 e^{x}}{\\left(e^{x} - 1\\right)^2} \\\\ x &= \\frac{\\theta_E}{T} = \\frac{\\hbar\\omega_E}{k_BT} \\end{aligned}"
    label: "Varmekapasiteten i Einstein-modellen, der alle $3N$ svingninger har frekvensen $\\omega_E$ og $\\theta_E = \\hbar\\omega_E/k_B$. Går mot $3Nk_B$ (Dulong-Petit) for $T \\gg \\theta_E$ og eksponentielt mot null for $T \\ll \\theta_E$."
  - id: tillatte-k
    section: Tilstandstettheten
    tex: "\\begin{aligned} k &= \\frac{2\\pi}{L}\\,m \\\\ m &= 0, \\pm1, \\pm2, \\dots \\end{aligned}"
    label: "De tillatte bølgevektorene i en kjede med lengde $L = Na$ og periodiske grensebetingelser $u_{n+N} = u_n$. Avstanden er $\\Delta k = 2\\pi/L$, og første Brillouin-sone rommer $N$ verdier. I tre dimensjoner tar hver svingning volumet $(2\\pi/L)^3$ i $k$-rommet."
  - id: tilstandstetthet-1d
    section: Tilstandstettheten
    tex: "D(\\omega) = \\dfrac{L}{\\pi}\\,\\dfrac{1}{\\mathrm d\\omega/\\mathrm dk}"
    label: "Tilstandstettheten i én dimensjon: antall svingninger per frekvensenhet, med faktoren 2 for $\\pm k$ regnet inn. Den divergerer der gruppehastigheten er null. For kjeden med én atomtype er $D = (2N/\\pi)/\\sqrt{\\omega_m^2 - \\omega^2}$."
  - id: antall-tilstander-3d
    section: Tilstandstettheten
    tex: "N(k) = \\dfrac{V k^3}{6\\pi^2}"
    label: "Antall svingninger med bølgevektor mindre enn $k$ i en krystall med volum $V$, per polarisasjon: kulevolumet $4\\pi k^3/3$ delt på volumet $(2\\pi)^3/V$ per svingning. Tilstandstettheten er $D(\\omega) = \\mathrm dN/\\mathrm d\\omega$."
  - id: debye-tilstandstetthet
    section: Debye-modellen
    tex: "D(\\omega) = \\dfrac{V\\omega^2}{2\\pi^2 v^3}, \\qquad \\omega \\le \\omega_D"
    label: "Tilstandstettheten i Debye-modellen, per polarisasjon, fra $\\omega = vk$ for alle $k$. De optiske grenene er ikke med. Parabelen stopper ved $\\omega_D$, som gir $N$ svingninger per polarisasjon."
  - id: debye-temperatur
    section: Debye-modellen
    tex: "\\begin{aligned} \\omega_D &= v\\left(\\frac{6\\pi^2 N}{V}\\right)^{1/3} \\\\ \\theta_D &= \\frac{\\hbar\\omega_D}{k_B} \\end{aligned}"
    label: "Debye-frekvensen, fra $\\int_0^{\\omega_D} D\\,\\mathrm d\\omega = N$, og Debye-temperaturen: der $k_BT$ er lik den høyeste fononenergien i modellen. Bly 105 K, kobber 343 K, silisium 645 K, diamant 2230 K."
  - id: debye-t3
    section: Debye-modellen
    tex: "\\begin{aligned} C_V &= \\frac{12\\pi^4}{5}\\,Nk_B\\left(\\frac{T}{\\theta_D}\\right)^3 \\\\ &\\approx 234\\,Nk_B\\left(\\frac{T}{\\theta_D}\\right)^3 \\end{aligned}"
    label: "Debyes $T^3$-lov, gyldig for $T$ under omtrent $\\theta_D/50$. Fra $U = 9Nk_BT\\,(T/\\theta_D)^3\\int_0^{\\theta_D/T} x^3\\,\\mathrm dx/(e^x - 1)$ med integralet $\\pi^4/15$ når $T \\to 0$. Bare andelen $(T/\\theta_D)^3$ av svingningene er eksitert, hver med energi omtrent $k_BT$. For $T \\gg \\theta_D$ gir samme integral $3Nk_B$."

  - id: drude-ledningsevne
    section: Drude-modellen
    tex: "\\sigma = \\dfrac{ne^2\\tau}{m}"
    label: "Ledningsevnen i Drude-modellen, fra drifthastigheten $\\langle\\vec v\\rangle = -e\\tau\\vec E/m$ og $\\vec j = -ne\\langle\\vec v\\rangle = \\sigma\\vec E$. $n$ er tettheten av ledningselektroner og $\\tau$ relaksasjonstiden, middeltiden mellom to kollisjoner. Gjelder også i fri-elektronmodellen."
  - id: hall-koeffisient
    section: Hall-effekten
    tex: "R_H = \\dfrac{E_y}{j_xB_z} = -\\dfrac{1}{ne}"
    label: "Hall-koeffisienten, fra likevekten der Hall-feltet $E_y$ opphever den magnetiske kraften på bærerne. Negativ for elektroner, positiv for positive bærere. Gir tettheten $n$ uten å kjenne $\\tau$."
  - id: varmeledningsevne
    section: Varmeledning
    tex: "K = \\tfrac13\\,Cv\\ell, \\qquad \\ell = v\\tau"
    label: "Varmeledningsevnen fra kinetisk gassteori. $C$ er varmekapasiteten per volum, $v$ farten og $\\ell$ den frie veilengden. For ledningselektronene er $v = v_F$, fordi bare elektronene nær Fermi-energien tar opp varme."
  - id: wiedemann-franz
    section: Varmeledning
    tex: "\\dfrac{K}{\\sigma T} = L = \\dfrac{\\pi^2}{3}\\left(\\dfrac{k_B}{e}\\right)^2"
    label: "Wiedemann-Franz’ lov med Lorenz-tallet fra fri-elektronmodellen, $L = 2{,}44 \\cdot 10^{-8}$ W Ω/K². Både $n$ og $\\tau$ faller bort. Drude-modellen gir $(4/\\pi)(k_B/e)^2 = 0{,}95 \\cdot 10^{-8}$ W Ω/K²."
  - id: fermi-dirac
    section: Fri elektrongass
    tex: "f(\\varepsilon) = \\dfrac{1}{e^{(\\varepsilon - \\mu)/k_BT} + 1}"
    label: "Fermi-Dirac-fordelingen: sannsynligheten for at en tilstand med energi $\\varepsilon$ er besatt. $\\mu$ er det kjemiske potensialet, lik $\\varepsilon_F$ ved $T = 0$. Ved $T = 0$ er $f$ et trappetrinn, og ved $T > 0$ rundes det av over noen få $k_BT$."
  - id: fermi-bolgevektor
    section: Fri elektrongass
    tex: "k_F = \\left(3\\pi^2 n\\right)^{1/3}"
    label: "Fermi-bølgevektoren, radien i Fermi-kula, fra $N = 2\\cdot(L/2\\pi)^3\\cdot\\tfrac43\\pi k_F^3$: to spinn per tillatt $\\vec k$ i en kube med volum $V = L^3$. Avhenger bare av elektrontettheten $n = N/V$."
  - id: fermi-energi
    section: Fri elektrongass
    tex: "\\varepsilon_F = \\dfrac{\\hbar^2 k_F^2}{2m} = \\dfrac{\\hbar^2}{2m}\\left(3\\pi^2 n\\right)^{2/3}"
    label: "Fermi-energien for frie elektroner, skrives også $E_F$. Noen få eV i metaller: 3,2 eV i natrium, 7,0 eV i kobber og 11,7 eV i aluminium."
  - id: fermi-hastighet
    section: Fri elektrongass
    tex: "v_F = \\dfrac{\\hbar k_F}{m}, \\qquad T_F = \\dfrac{\\varepsilon_F}{k_B}"
    label: "Fermi-hastigheten og Fermi-temperaturen. $v_F$ er rundt $10^6$ m/s og $T_F$ $10^4$ til $10^5$ K i metaller, så $T \\ll T_F$ ved alle temperaturer et metall kan ha. Kobber: $v_F = 1{,}57 \\cdot 10^6$ m/s og $T_F = 82\\,000$ K."
  - id: elektron-tilstandstetthet
    section: Fri elektrongass
    tex: "D(\\varepsilon) = \\dfrac{V}{2\\pi^2}\\left(\\dfrac{2m}{\\hbar^2}\\right)^{3/2}\\sqrt{\\varepsilon} \\allowbreak = \\dfrac{3N}{2\\varepsilon_F}\\sqrt{\\dfrac{\\varepsilon}{\\varepsilon_F}}"
    label: "Tilstandstettheten for frie elektroner i tre dimensjoner, med begge spinnretninger, fra $N(\\varepsilon) = N(\\varepsilon/\\varepsilon_F)^{3/2}$. Antallet elektroner i $\\mathrm d\\varepsilon$ er $D(\\varepsilon)f(\\varepsilon)\\,\\mathrm d\\varepsilon$. I to dimensjoner er $D$ konstant."
  - id: elektron-varmekapasitet
    section: Elektronenes varmekapasitet
    tex: "C_\\text{el} = \\dfrac{\\pi^2}{2}\\,Nk_B\\,\\dfrac{T}{T_F}"
    label: "Varmekapasiteten til elektrongassen for $T \\ll T_F$. Bare elektronene innenfor omtrent $k_BT$ fra $\\varepsilon_F$ tar opp energi, rundt én prosent av den klassiske verdien $\\tfrac32 Nk_B$ ved romtemperatur. I et metall ved lav temperatur er $C = \\gamma T + AT^3$, med gitterleddet fra Debyes $T^3$-lov."

  # ── Laboratorieøvingene ──
  - id: fotonenergi
    section: Røntgendiffraksjon i laben
    tex: "E = \\dfrac{hc}{\\lambda}"
    label: "Energien til et foton med bølgelengde $\\lambda$. Med $\\lambda$ i ångström gir $hc = 12{,}398$ keV Å energien i keV. Mo $K_\\alpha$-linjen i røntgenlaben har $\\lambda = 0{,}7093$ Å, altså $E = 17{,}5$ keV."
  - id: vinkelfeil
    section: Røntgendiffraksjon i laben
    tex: "\\dfrac{\\Delta d}{d} = \\dfrac{\\Delta a}{a} = -\\dfrac{\\Delta\\theta}{\\tan\\theta}"
    label: "Hvordan en feil $\\Delta\\theta$ i vinkelen slår ut i planavstanden og gitterkonstanten, fra derivasjon av Braggs lov. $\\Delta\\theta$ er i radianer og halvparten av feilen i $2\\theta$. Samme vinkelfeil gir størst feil i $d$ ved små vinkler."
  - id: scherrer
    section: Røntgendiffraksjon i laben
    tex: "t \\approx \\dfrac{0{,}9\\,\\lambda}{\\beta\\cos\\theta}"
    label: "Scherrer-formelen: krystallittstørrelsen $t$ fra bredden $\\beta$ av en topp, målt som full bredde ved halv høyde i radianer på $2\\theta$-skalaen. Den gjelder når krystallittene er så små at de bestemmer bredden; bredden instrumentet gir, må trekkes fra først."
  - id: elektron-bolgelengde
    section: Elektronmikroskopi
    tex: "\\lambda = \\dfrac{h}{\\sqrt{2meV\\left(1 + \\dfrac{eV}{2mc^2}\\right)}}"
    label: "Bølgelengden til elektroner akselerert gjennom spenningen $V$. Parentesen er den relativistiske korreksjonen: $mc^2 = 511$ keV, så $eV/2mc^2 = 0{,}20$ ved 200 kV, der $\\lambda = 2{,}51$ pm."
  - id: kameralikning
    section: Elektronmikroskopi
    tex: "R_{hkl}\\, d_{hkl} = \\lambda L"
    label: "Kameralikningen. $R_{hkl}$ er avstanden fra sentrum til refleksen $hkl$ på diffraksjonsbildet, og $L$ er kameralengden. Den følger av Braggs lov for små vinkler, $2\\theta \\approx R_{hkl}/L$ og $2\\theta \\approx \\lambda/d_{hkl}$. Kamerakonstanten $\\lambda L$ kalibreres med en kjent krystall."
  - id: vinkel-reflekser
    section: Elektronmikroskopi
    tex: "\\cos\\varphi = \\dfrac{h_1h_2 + k_1k_2 + l_1l_2}{|\\vec g_1|\\,|\\vec g_2|}"
    label: "Vinkelen mellom refleksene $h_1k_1l_1$ og $h_2k_2l_2$ i et kubisk gitter, sett fra sentrum av diffraksjonsbildet, med $|\\vec g_i| = \\sqrt{h_i^2 + k_i^2 + l_i^2}$. Forholdet mellom avstandene er $R_1/R_2 = d_2/d_1 = |\\vec g_1|/|\\vec g_2|$."
  - id: soneakse
    section: Elektronmikroskopi
    tex: "\\begin{aligned} &[UVW] \\parallel \\vec g_1 \\times \\vec g_2 \\\\ &hU + kV + lW = 0 \\end{aligned}"
    label: "Soneaksen er retningen elektronstrålen går langs gjennom krystallen. I et kubisk gitter finnes den som kryssproduktet av to reflekser i bildet, regnet med indeksene. Hver refleks $hkl$ i bildet oppfyller Weiss' sonelov i andre linje."
  - id: bolgetall
    section: Infrarød spektroskopi
    tex: "\\sigma = \\dfrac{1}{\\lambda} = \\dfrac{\\nu}{c}, \\qquad \\omega = 2\\pi c\\,\\sigma"
    label: "Bølgetallet i IR-spektroskopi, uten faktoren $2\\pi$ som bølgevektoren $k = 2\\pi/\\lambda$ har. Med $\\sigma$ i cm$^{-1}$ må $c$ være i cm/s. 1000 cm$^{-1}$ svarer til $\\lambda = 10$ µm og en fotonenergi på 0,124 eV."
  - id: planck-straling
    section: Infrarød spektroskopi
    tex: "I(\\nu) = \\dfrac{2h\\nu^3/c^2}{e^{h\\nu/k_BT} - 1}"
    label: "Plancks strålingslov: effekten et svart legeme stråler ut per flate, romvinkel og frekvensenhet, i W m$^{-2}$ sr$^{-1}$ Hz$^{-1}$. Nevneren er den samme som i Planck-fordelingen for fononer."
  - id: wien
    section: Infrarød spektroskopi
    tex: "\\begin{aligned} \\nu_\\text{maks} &= 5{,}879 \\cdot 10^{10}\\ \\tfrac{\\text{Hz}}{\\text{K}}\\cdot T \\\\ \\sigma_\\text{maks} &= 1{,}961\\ \\tfrac{\\text{cm}^{-1}}{\\text{K}}\\cdot T \\end{aligned}"
    label: "Wiens forskyvningslov for toppen av $I(\\nu)$. Fordelingen per bølgelengde har toppen et annet sted, ved $\\lambda_\\text{maks}T = 2{,}898$ mm K, og $1/\\lambda_\\text{maks}$ er 1,76 ganger $\\sigma_\\text{maks}$."
  - id: stefan-boltzmann
    section: Infrarød spektroskopi
    tex: "\\pi\\int_0^\\infty I(\\nu)\\,\\mathrm d\\nu = \\sigma_\\text{SB}\\,T^4"
    label: "Stefan-Boltzmanns lov: den totale effekten et svart legeme stråler ut per flate. Faktoren $\\pi$ kommer av integralet over halvkulen, og $\\sigma_\\text{SB} = 2\\pi^5k_B^4/15c^2h^3 = 5{,}67 \\cdot 10^{-8}$ W m$^{-2}$ K$^{-4}$."
  - id: frihetsgrader
    section: Infrarød spektroskopi
    tex: "3N - 6"
    label: "Antall svingninger i et fritt molekyl med $N$ atomer: $3N$ koordinater minus 3 for translasjon og 3 for rotasjon. Et lineært molekyl har bare to rotasjoner og derfor $3N - 5$ svingninger. I en krystall med periodiske grensebetingelser trekkes ingenting fra, og $N$ celler med $s$ atomer gir $3Ns$ svingninger."
  - id: redusert-masse
    section: Infrarød spektroskopi
    tex: "\\omega = \\sqrt{\\dfrac{C}{\\mu}}, \\qquad \\mu = \\dfrac{M_1M_2}{M_1 + M_2}"
    label: "Frekvensen til to atomer bundet med én fjær med kraftkonstant $C$, med den reduserte massen $\\mu$. Snudd rundt gir den kraftkonstanten fra et målt bølgetall, $C = \\mu(2\\pi c\\sigma)^2$."
  - id: kjede-grenser
    section: Gittersvingninger
    tex: "\\begin{aligned} \\omega_\\text{op}^2(0) &= 2C\\left(\\dfrac{1}{M_1} + \\dfrac{1}{M_2}\\right) \\\\ v &= a\\sqrt{\\dfrac{C}{2(M_1 + M_2)}} \\end{aligned}"
    label: "Kjeden med to atomtyper ved $k \\to 0$: frekvensen i den optiske grenen og lydhastigheten i den akustiske. Hvert atom har en fjær på hver side, så den optiske frekvensen er $\\sqrt 2$ ganger frekvensen $\\sqrt{C/\\mu}$ til ett atompar med én fjær."

glossary:
  - term: Bravais-gitter
    section: Gitter og basis
    definition: "Et uendelig sett av punkter generert av $\\vec{R} = n_1\\vec{a}_1 + n_2\\vec{a}_2 + n_3\\vec{a}_3$ med heltallige $n_i$. Gitteret ser <b>nøyaktig likt ut</b> sett fra ethvert gitterpunkt, i både avstand og retning. Et gitter er ren geometri, og det inneholder ingen atomer."
  - term: Gitterpunkt
    section: Gitter og basis
    definition: "Et av de matematiske punktene i et Bravais-gitter. Det er ikke det samme som et atom: atomene kommer fra basisen som plasseres på hvert gitterpunkt, og gitterpunktet kan like gjerne ligge i et tomrom."
  - term: Primitive gittervektorer
    section: Gitter og basis
    definition: "Et sett vektorer $\\vec{a}_1, \\vec{a}_2, \\vec{a}_3$ som genererer <em>alle</em> gitterpunkter med heltallige koeffisienter, og ikke flere. Valget er ikke entydig, og samme gitter har uendelig mange gyldige sett."
  - term: Basis
    section: Gitter og basis
    definition: "Gruppen av atomer som festes til hvert eneste gitterpunkt, oppgitt ved posisjonene $\\vec{r}_j$ relativt til punktet. Basisen er identisk på alle gitterpunkter, i sammensetning, orientering og avstander."
  - term: Krystallstruktur
    section: Gitter og basis
    definition: "Gitter $+$ basis. Strukturen er det fysiske arrangementet av atomer; gitteret alene er bare translasjonsmønsteret det gjentas etter."
  - term: Enhetscelle
    section: Enhetsceller og pakning
    definition: "Et volum som fyller hele rommet uten hull eller overlapp når det gjentas med alle gittervektorene $\\vec{R}$."
  - term: Primitiv enhetscelle
    section: Enhetsceller og pakning
    definition: "En enhetscelle som inneholder <b>nøyaktig ett</b> gitterpunkt. Den har minst mulig volum, men speiler ofte ikke gitterets symmetri, og derfor brukes den konvensjonelle cellen i praksis."
  - term: Konvensjonell enhetscelle
    section: Enhetsceller og pakning
    definition: "Den cellen du faktisk regner og tegner med, valgt fordi den viser symmetrien (typisk en kube). Den er som regel <b>ikke</b> primitiv: fcc rommer 4 gitterpunkter, bcc 2."
  - term: Wigner-Seitz-celle
    section: Enhetsceller og pakning
    definition: "Den primitive cellen rundt et gitterpunkt bestående av alle punkter som ligger nærmere <em>dette</em> gitterpunktet enn noe annet. Konstrueres ved å halvere vektorene til alle nærliggende naboer med normalplan. Cellen er både primitiv og entydig, og den har gitterets fulle symmetri."
  - term: Koordinasjonstall
    section: Enhetsceller og pakning
    definition: "Antall nærmeste naboer et <b>atom</b> har. Enkel kubisk har 6, romsentrert kubisk 8 og flatesentrert kubisk 12. Høyere tall følger med tettere pakking."
  - term: Pakningsgrad
    section: Enhetsceller og pakning
    definition: "Andelen av cellevolumet som fylles av harde kuler som akkurat berører hverandre: $0{,}52$ (sc), $0{,}68$ (bcc) og $0{,}74$ (fcc). Ingen pakking av like kuler er tettere enn $0{,}7405$."
  - term: Gitterkonstant
    section: Enhetsceller og pakning
    definition: "Kantlengdene $a, b, c$ i den konvensjonelle enhetscellen. For kubiske gitter er det én verdi $a$, og den brukes som lengdeskala for alt annet i cellen. Den er <b>ikke</b> avstanden mellom naboatomer, unntatt i enkel kubisk."
  - term: Krystallsystem
    section: De 14 gitrene i rommet
    definition: "En av de sju klassene av celleformer i tre dimensjoner (triklin, monoklin, ortorombisk, tetragonal, trigonal, heksagonal og kubisk), bestemt av forholdene mellom $a, b, c$ og vinklene $\\alpha, \\beta, \\gamma$."
  - term: Sentrering
    section: De 14 gitrene i rommet
    definition: "Ekstra gitterpunkter lagt til en konvensjonell celle: <b>P</b> primitiv, <b>C</b> basesentrert, <b>I</b> romsentrert, <b>F</b> flatesentrert og <b>R</b> romboedrisk. En sentrering gir bare et nytt Bravais-gitter hvis den verken senker symmetrien eller kan erstattes av en mindre celle i samme krystallsystem."
  - term: Symmetrioperasjon
    section: Symmetri
    definition: "En operasjon som fører krystallen tilbake til en konfigurasjon som ikke kan skilles fra utgangspunktet. De fire som gjelder for et krystallgitter er translasjon, speiling, inversjon og rotasjon."
  - term: Translasjonssymmetri
    section: Symmetri
    definition: "Invarians under forskyvning med en gittervektor $\\vec{R}$. Dette er den definerende symmetrien til et krystallinsk stoff, og den som skiller krystallen fra et amorft materiale. Den er <b>nødvendig, men ikke tilstrekkelig</b> for et Bravais-gitter: også honeycomb-nettet i grafén oppfyller den."
  - term: Speilsymmetri
    section: Symmetri
    definition: "Invarians under speiling om et plan (i 2D: en linje), betegnet $m$. Halvparten av strukturen bestemmer den andre halvparten."
  - term: Inversjonssymmetri
    section: Symmetri
    definition: "Invarians under $\\vec{r} \\to -\\vec{r}$ om et senterpunkt, betegnet $\\bar{1}$. I 2D er det det samme som en $180^\\circ$-rotasjon; i 3D er det ikke det. Ethvert Bravais-gitter har den, siden $-\\vec{R}$ er en gittervektor når $\\vec{R}$ er det."
  - term: Rotasjonssymmetri
    section: Symmetri
    definition: "Invarians under rotasjon $360^\\circ/n$ om en akse. I et gitter må $2\\cos(2\\pi/n)$ være et heltall, og siden $|2\\cos\\theta| \\le 2$ finnes det bare fem løsninger, nemlig $n = 1, 2, 3, 4$ og $6$."
  - term: Krystallografisk begrensning
    section: Symmetri
    definition: "Kravet $2\\cos(2\\pi/n) \\in \\mathbb{Z}$. Det følger av at $\\vec D - \\vec C = 2a\\cos\\theta\\,\\hat a$ er en gittervektor parallell med den korteste gittervektoren $\\vec a$, og derfor må være et helt multiplum av den. Bare $n = 1, 2, 3, 4$ og $6$ oppfyller det, så en femtellig eller sjutellig akse er umulig i et gitter."
  - term: Tettpakking
    section: Tettpakkede strukturer
    definition: "Stabling av like kuler med størst mulig pakningsgrad, $\\pi/\\sqrt{18} \\approx 0{,}74$. Hvert lag ligger i fordypningene til laget under; rekkefølgen ABAB gir hcp og ABC gir fcc. At det ikke går tettere, formodet Kepler i 1611, og Hales beviste det i 1998."
  - term: Heksagonal tettpakking
    section: Tettpakkede strukturer
    definition: "Tettpakkingen med stablingsrekkefølgen ABAB, forkortet hcp. Strukturen er det heksagonale Bravais-gitteret med en basis på to atomer, og pakningsgraden er $0{,}74$, samme som i fcc."
  - term: Diamantstruktur
    section: Strukturer som gitter pluss basis
    definition: "fcc-gitteret med en basis på to like atomer, i $(0,0,0)$ og $(\\tfrac14,\\tfrac14,\\tfrac14)$. Hvert atom har 4 naboer, og pakningsgraden er bare $0{,}34$; det er de kovalente bindingene som holder strukturen oppe. Karbon, silisium og germanium krystalliserer slik."
  - term: Miller-indekser
    section: Miller-indekser
    definition: "Tre heltall $(hkl)$ som navngir en familie av gitterplan: les av skjæringspunktene med aksene i gitterkonstanter, inverter og reduser til minste heltall med samme forhold. En indeks $0$ betyr at planet er parallelt med aksen, og strek over betyr negativ, som i $(\\bar{1}00)$."
  - term: Planfamilie
    section: Miller-indekser
    definition: "Alle planene med samme Miller-indekser: parallelle, med lik avstand, og til sammen gjennom alle gitterpunktene. Symmetriekvivalente familier samles i krøllparenteser; kubens seks flater er $\\{100\\}$."
  - term: Krystallretning
    section: Retninger og planavstand
    definition: "Retningen $u\\vec{a}_1 + v\\vec{a}_2 + w\\vec{a}_3$, skrevet $[uvw]$ med minste heltall. $\\vec{a}_1$ peker langs $[100]$ og $-\\vec{a}_2$ langs $[0\\bar{1}0]$. I kubiske gitter står $[hkl]$ normalt på planet $(hkl)$."
  - term: Planavstand
    section: Retninger og planavstand
    definition: "Avstanden $d$ mellom naboplan i en familie. I kubiske gitter er $d_{hkl} = a/\\sqrt{h^2+k^2+l^2}$, så familier med høye indekser ligger tett."
  - term: Braggs lov
    section: Braggs lov
    definition: "Kravet $2d\\sin\\theta = n\\lambda$ for konstruktiv refleksjon fra en familie av parallelle plan med avstand $d$. Planene virker som svake speil, og gangforskjellen mellom naboplan er $2d\\sin\\theta$. Siden $\\sin\\theta \\le 1$ gir hver planfamilie bare et endelig antall refleksjonsordener $n$."
  - term: Kinematisk diffraksjonsteori
    section: Spredningsvektoren
    definition: "Diffraksjonsteorien som antar at hver bølge spres høyst én gang i prøven, og at spredningen er elastisk. Da kan bidragene fra alle volumelementene summeres med hver sin fase, og amplituden er Fourier-transformen av spredningstettheten."
  - term: Spredningsvektor
    section: Spredningsvektoren
    definition: "Endringen i bølgevektor ved spredningen, $\\vec{Q} = \\vec{k}_f - \\vec{k}_i$. Elastisk spredning gir $|\\vec{Q}| = (4\\pi/\\lambda)\\sin\\theta$, der $2\\theta$ er vinkelen mellom strålene. Diffraksjonsbildet leses som funksjon av $\\vec{Q}$."
  - term: Spredningstetthet
    section: Spredningsvektoren
    definition: "Tettheten $\\rho(\\vec{r})$ som sprer bølgen: elektrontettheten for røntgen, kjernene for nøytroner og begge deler for elektroner. Valget av probe avgjør derfor hva et eksperiment ser."
  - term: Resiprokt gitter
    section: Det resiproke gitteret
    definition: "Mengden av vektorer $\\vec{G}$ med $e^{i\\vec{G}\\cdot\\vec{R}} = 1$, altså $\\vec{G}\\cdot\\vec{R} = 2\\pi \\cdot \\text{heltall}$, for alle gittervektorer $\\vec{R}$. Det er selv et Bravais-gitter i $k$-rommet, generert av $\\vec{b}_1, \\vec{b}_2, \\vec{b}_3$, og store avstander i det direkte gitteret gir små i det resiproke."
  - term: Diffraksjonsbetingelsen
    section: Diffraksjonsbetingelsen
    definition: "Betingelsen $\\vec{Q} = \\vec{G}$, også kalt Laue-betingelsen: spredningsamplituden er null med mindre spredningsvektoren er en resiprok gittervektor. Komponentvis er den de tre Laue-ligningene $\\vec{a}_i \\cdot \\vec{Q} = 2\\pi m_i$. Ekvivalent med Braggs lov."
  - term: Konvolusjon
    section: Krystallen som konvolusjon
    definition: "Integralet $(f \\circledast g)(x) = \\int f(x')\\, g(x - x')\\, \\mathrm{d}x'$: den ene funksjonen stemples ut på hvert punkt av den andre. En krystalltetthet er gitteret konvolvert med basisens tetthet, og konvolusjonsteoremet $\\mathcal{F}(f \\circledast g) = \\mathcal{F}(f) \\cdot \\mathcal{F}(g)$ sier at transformen da faktoriserer."
  - term: Ewald-kule
    section: Ewald-kulen
    definition: "Kulen med radius $k = 2\\pi/\\lambda$ om halen til $\\vec k_i$, tegnet i det resiproke rommet med spissen av $\\vec k_i$ i origo. Hvert resiprokt gitterpunkt på kuleflaten gir en refleks, for da er $\\vec k_f - \\vec k_i$ en resiprok gittervektor med $|\\vec k_f| = |\\vec k_i|$. Punkter med $|\\vec G| > 2k$ kan aldri gi refleks."
  - term: Laue-metoden
    section: Diffraksjonsmetoder
    definition: "Diffraksjon fra en énkrystall i ro, bestrålt med et kontinuerlig spekter. Hver bølgelengde har sin egen Ewald-kule gjennom origo, og alle resiproke gitterpunkter mellom den minste og den største kulen gir refleks. Bildet viser krystallens symmetri direkte."
  - term: Pulverdiffraksjon
    section: Diffraksjonsmetoder
    definition: "Diffraksjon fra et pulver av små krystallkorn i alle orienteringer, også kalt Debye-Scherrer-metoden. Hvert $\\vec G$ smøres ut til en kuleflate med radius $|\\vec G|$, snittet med Ewald-kulen er en sirkel, og de spredte strålene danner en kjegle med halv toppvinkel $2\\theta$. Resultatet er ringer, avlest som intensitet mot $2\\theta$."
  - term: Faseproblemet
    section: Faseproblemet
    definition: "Detektoren måler $|F(\\vec Q)|^2$, og fasen til $F$ går tapt fordi den svinger med strålingens frekvens. Tettheten kan derfor ikke regnes ut direkte ved å transformere målingen tilbake. Strukturen bestemmes ved å regne ut $|S_{hkl}|^2$ for en modell og sammenligne med de målte intensitetene."
  - term: Strukturfaktor
    section: Strukturfaktoren
    definition: "Summen $S_{hkl} = \\sum_j f_j e^{2\\pi i(hx_j + ky_j + lz_j)}$ over atomene i basisen, med posisjonene i relative koordinater. Den bestemmer styrken til refleksen $(hkl)$: $F = NS_{hkl}$ og $I \\propto |S_{hkl}|^2$. Den faktoriserer alltid i en faktor for gitteret og en for basisen."
  - term: Atomformfaktor
    section: Strukturfaktoren
    definition: "Spredningsamplituden fra ett atom, $f_j(\\vec Q) = \\int \\rho_j e^{i\\vec Q\\cdot\\vec r}\\,\\mathrm{d}V$. For røntgen er den lik antall elektroner ved $\\vec Q = 0$ og avtar med $|\\vec Q|$. Tunge atomer dominerer derfor et røntgenbilde, og hydrogen er nesten usynlig."
  - term: Systematisk utslukking
    section: Systematiske utslukkinger
    definition: "En refleks som oppfyller $\\vec Q = \\vec G$, men likevel mangler fordi strukturfaktoren er null: bidragene fra atomene i basisen er i motfase. Regelen for hvilke $(hkl)$ som overlever, kalles utvalgsregelen; for bcc er den $h+k+l$ partall, for fcc at $h, k, l$ er alle partall eller alle oddetall."
  - term: Brillouin-sone
    section: Brillouin-soner
    definition: "Den første Brillouin-sonen er Wigner-Seitz-cellen til det resiproke gitteret: alle $\\vec k$ som ligger nærmere origo enn noe annet resiprokt gitterpunkt. Grensene er planene som halverer vektorene $\\vec G$ normalt, og en bølge med $\\vec k$ på grensen oppfyller diffraksjonsbetingelsen. For fcc er sonen et avkuttet oktaeder, for bcc et rombedodekaeder."

  - term: Kohesjonsenergi
    section: Kohesjonsenergi
    definition: "Energien som må tilføres for å dele krystallen opp i frie, nøytrale atomer i ro, uendelig langt fra hverandre og med samme elektronkonfigurasjon som i krystallen (<em>cohesive energy</em>). Oppgis per atom: $0{,}02$ eV for Ne, $7{,}37$ eV for diamant og $8{,}90$ eV for W."
  - term: Gitterenergi
    section: Kohesjonsenergi
    definition: "Kohesjonsenergien til en ionekrystall regnet fra frie <b>ioner</b> i stedet for frie atomer. Den er større enn kohesjonsenergien med det det koster å lage ionene: for NaCl er gitterenergien $7{,}9$ eV per ionpar og kohesjonsenergien $7{,}9 - 5{,}14 + 3{,}61 = 6{,}4$ eV."
  - term: Ioniseringsenergi
    section: Kohesjonsenergi
    definition: "Energien som skal til for å fjerne det løsest bundne elektronet fra et fritt atom, så det blir et positivt ion. $5{,}14$ eV for natrium."
  - term: Elektronaffinitet
    section: Kohesjonsenergi
    definition: "Energien som frigjøres når et fritt atom tar imot et elektron og blir et negativt ion. $3{,}61$ eV for klor."
  - term: Van der Waals-binding
    section: Van der Waals-binding
    definition: "Bindingen mellom nøytrale atomer med fylte skall, som i edelgasskrystallene. Øyeblikksdipolen i det ene atomet induserer en dipol i det andre, og de to tiltrekker hverandre med en energi som avtar som $-1/r^6$. Bindingen er svak, $0{,}02$ til $0{,}17$ eV per atom, og uten retning, så edelgassene krystalliserer i fcc."
  - term: Lennard-Jones-potensialet
    section: Van der Waals-binding
    definition: "$U(r) = 4\\varepsilon[(\\sigma/r)^{12} - (\\sigma/r)^{6}]$: van der Waals-tiltrekningen $-r^{-6}$ pluss Pauli-frastøtningen $+r^{-12}$ når elektronskyene overlapper. $\\varepsilon$ og $\\sigma$ måles i gassfase; for argon er de $0{,}0104$ eV og $3{,}40$ Å."
  - term: Ionisk binding
    section: Ionisk binding
    definition: "Bindingen i krystaller av positive og negative ioner med fylte skall, som NaCl og CsCl. Elektronet flyttes fra metallet til ikke-metallet, og Coulomb-tiltrekningen mellom motsatte ladninger holder krystallen sammen. Den rekker langt, har ingen retning og gir flere eV per ionpar."
  - term: Madelung-konstant
    section: Ionisk binding
    definition: "Det rene tallet $\\alpha = \\sum_j (\\pm)/p_{ij}$ som samler Coulomb-energien fra hele krystallen på ett ion, med pluss for motsatt ladning. Den avhenger bare av strukturen: $1{,}7476$ for NaCl, $1{,}7627$ for CsCl og $1{,}6381$ for ZnS. Summert skall for skall konvergerer ikke rekken; den må summeres i nøytrale grupper."
  - term: Kovalent binding
    section: Kovalent binding
    definition: "Et elektronpar delt mellom to atomer, med overlappende bølgefunksjoner og motsatte spinn. Sterk, flere eV per atom, og med retning: i gruppe IV danner $sp^3$-orbitalene fire bindinger i tetraedervinkler, og resultatet er diamantstrukturen med pakningsgrad $0{,}34$."
  - term: Metallisk binding
    section: Metallisk binding
    definition: "Positive ioner i en sjø av delokaliserte valenselektroner. Bindingen kommer av at elektronenes kinetiske energi synker når de får bre seg over hele krystallen. Den har ingen retning, så metaller pakker tett, leder og lar seg forme. Fra $1{,}11$ eV per atom i natrium til $8{,}90$ eV i wolfram, der $d$-elektronene også bidrar."
  - term: Hydrogenbinding
    section: Hydrogenbinding
    definition: "Et hydrogenatom mellom to sterkt elektronegative atomer, som F, O eller N. Elektronet trekkes over til det ene, og protonet som er igjen, binder begge. Svak, rundt $0{,}1$ eV, og viktig i is, HF og DNA."

  - term: Harmonisk tilnærming
    section: Gittersvingninger
    definition: "Parpotensialet erstattet med parabelen $U(a) + \\tfrac12 U''(a)(r - a)^2$ rundt likevekt, så kraften mellom naboatomer følger Hookes lov med kraftkonstanten $C = U''(a)$. Gjelder for små utsving, og gir et harmonisk gitter der alle svingninger er uavhengige."
  - term: Dispersjonsrelasjon
    section: Gittersvingninger
    definition: "Sammenhengen $\\omega(k)$ mellom frekvensen og bølgevektoren til en bølge i gitteret. For kjeden med én atomtype er den $\\omega = 2\\sqrt{C/M}\\,|\\sin(ka/2)|$. Den er periodisk med $2\\pi/a$, så alt ligger i første Brillouin-sone, og stigningen $\\mathrm d\\omega/\\mathrm dk$ er gruppehastigheten."
  - term: Gruppehastighet
    section: Gittersvingninger
    definition: "$v_g = \\mathrm d\\omega/\\mathrm dk$, hastigheten til en bølgepakke og dermed til energi og signaler. For lange bølger er den lik fasehastigheten $\\omega/k$, som er lydhastigheten $a\\sqrt{C/M}$. På sonegrensen er den null: bølgen står stille og transporterer ingen energi."
  - term: Akustisk gren
    section: Gittersvingninger
    definition: "Grenen av dispersjonsrelasjonen der $\\omega \\to 0$ når $k \\to 0$, og atomene i cellen svinger i fase. For lange bølger er den lyd, $\\omega = vk$. Alle krystaller har tre akustiske grener, én longitudinal (LA) og to transversale (TA)."
  - term: Optisk gren
    section: Gittersvingninger
    definition: "En gren med endelig $\\omega$ ved $k = 0$, der atomene i cellen svinger i motfase med massesenteret i ro, $u/v = -M_2/M_1$. Finnes bare med minst to atomer i den primitive cellen: $s$ atomer gir $3s - 3$ optiske grener (LO og TO). I ionekrystaller er svingningen et oscillerende dipolmoment som kobler til infrarødt lys, derav navnet."
  - term: Fonon
    section: Fononer
    definition: "Ett kvant $\\hbar\\omega(k)$ av en gittersvingning, slik et foton er et kvant av det elektromagnetiske feltet. Svingningen med bølgevektor $k$ har energien $(n + \\tfrac12)\\hbar\\omega(k)$ med $n$ fononer. Fononer er bosoner og følger Bose-Einstein-statistikk, så $n$ er ubegrenset. De bestemmer varmekapasiteten og varmeledningsevnen til faste stoffer."
  - term: Krystallimpuls
    section: Fononer
    definition: "$\\hbar\\vec k$ for et fonon. Den inngår som impuls i bevaringslovene ved spredning av fotoner, nøytroner og elektroner, men den fysiske impulsen til en gittersvingning med $k \\ne 0$ er null, for atomene beveger seg bare i forhold til hverandre."

  - term: Dulong-Petits lov
    section: Varmekapasitet
    definition: "Den klassiske varmekapasiteten $C_V = 3Nk_B$, per mol $3R = 24{,}9$ J/(mol·K), fra ekvipartisjonsprinsippet: hver av de $3N$ svingningene bærer $k_BT$. Stemmer ved høy temperatur, men målt går $C_V \\to 0$ som $T^3$ når $T \\to 0$."
  - term: Planck-fordelingen
    section: Varmekapasitet
    definition: "Middelantallet fononer i en svingning med frekvens $\\omega$ ved temperaturen $T$, $\\langle n \\rangle = 1/(e^{\\hbar\\omega/k_BT} - 1)$, også kalt Bose-Einstein-fordelingen. Middelenergien $\\hbar\\omega\\langle n \\rangle$ er $k_BT$ for $\\hbar\\omega \\ll k_BT$ og eksponentielt liten for $\\hbar\\omega \\gg k_BT$: svingningen er frosset ut."
  - term: Einstein-modellen
    section: Varmekapasitet
    definition: "Modellen der alle $3N$ svingninger har samme frekvens $\\omega_E$, med Einstein-temperaturen $\\theta_E = \\hbar\\omega_E/k_B$ som eneste parameter. Den gir $3Nk_B$ ved høy $T$ og et fall mot null ved lav, men fallet er eksponentielt og for bratt, fordi de akustiske svingningene med lav frekvens mangler. Passer for de optiske grenene."
  - term: Periodiske grensebetingelser
    section: Tilstandstettheten
    definition: "Kravet $u_{n+N} = u_n$ for en kjede av $N$ atomer, som om den var lukket til en ring. Løpende bølger er fortsatt løsninger, men bare med $k = 2\\pi m/L$, så $k$ er diskret med avstand $2\\pi/L$ og første Brillouin-sone rommer $N$ verdier. Passer for store krystaller; faste ender passer for nanokrystaller."
  - term: Tilstandstetthet
    section: Tilstandstettheten
    definition: "Antall tilstander per frekvens- eller energienhet. For gittersvingninger i én dimensjon er $D(\\omega) = (L/\\pi)/(\\mathrm d\\omega/\\mathrm dk)$, som divergerer der gruppehastigheten er null, og i tre dimensjoner er antallet med bølgevektor under $k$ lik $Vk^3/6\\pi^2$ per polarisasjon. For frie elektroner i tre dimensjoner er $D(\\varepsilon) \\propto \\sqrt{\\varepsilon}$, med $D(\\varepsilon_F) = 3N/2\\varepsilon_F$."
  - term: Debye-modellen
    section: Debye-modellen
    definition: "Modellen med $\\omega = vk$ for alle $k$, altså de akustiske grenene strukket til hele sonen og ingen optiske. Det gir $D(\\omega) = V\\omega^2/2\\pi^2v^3$ per polarisasjon opp til grensefrekvensen $\\omega_D$, som gir riktig antall svingninger. Den gir Dulong-Petit ved høy $T$ og $T^3$-loven ved lav."
  - term: Debye-temperatur
    section: Debye-modellen
    definition: "$\\theta_D = \\hbar\\omega_D/k_B$, temperaturen der $k_BT$ er lik den høyeste fononenergien i Debye-modellen, og stoffets eneste parameter i den. Høy for stive, lette stoffer: diamant 2230 K, silisium 645 K, kobber 343 K, bly 105 K. Under omtrent $\\theta_D/50$ er $C_V = 234\\,Nk_B(T/\\theta_D)^3$."

  - term: Drude-modellen
    section: Drude-modellen
    definition: "Den klassiske modellen fra 1900 for ledningselektronene i et metall. Elektronene er en gass av frie partikler som ikke vekselvirker med hverandre og kolliderer med ionene, med relaksasjonstiden $\\tau$ mellom kollisjonene. Den gir Ohms lov med $\\sigma = ne^2\\tau/m$ og Hall-koeffisienten $-1/ne$, men en varmekapasitet for elektronene som er rundt hundre ganger for stor."
  - term: Relaksasjonstid
    section: Drude-modellen
    definition: "Middeltiden $\\tau$ mellom to kollisjoner for et ledningselektron. Den bestemmer ledningsevnen $\\sigma = ne^2\\tau/m$, og i kobber ved romtemperatur er den $2{,}5 \\cdot 10^{-14}$ s."
  - term: Fri veilengde
    section: Drude-modellen
    definition: "Strekningen $\\ell$ et elektron går mellom to kollisjoner. I fri-elektronmodellen er $\\ell = v_F\\tau$, som er 39 nm i kobber ved romtemperatur og rundt 0,2 cm i svært rent kobber ved 4 K. Elektronene spres av fononer, urenheter og defekter, ikke av ionene i et perfekt gitter."
  - term: Hall-effekten
    section: Hall-effekten
    definition: "Et magnetfelt $B_z$ normalt på en strøm $j_x$ bøyer bærerne av mot den ene kanten av lederen, og ladningen som hoper seg opp, gir et elektrisk felt $E_y$ på tvers av strømmen. Hall-koeffisienten $R_H = E_y/j_xB_z = -1/ne$ gir tettheten av bærere, og fortegnet viser om de er negative eller positive."
  - term: Wiedemann-Franz’ lov
    section: Varmeledning
    definition: "Forholdet $K/\\sigma$ mellom varmeledningsevnen og den elektriske ledningsevnen er omtrent det samme for alle metaller og proporsjonalt med $T$, $K/\\sigma = LT$. Fri-elektronmodellen gir Lorenz-tallet $L = (\\pi^2/3)(k_B/e)^2 = 2{,}44 \\cdot 10^{-8}$ W Ω/K²."
  - term: Fermi-Dirac-fordelingen
    section: Fri elektrongass
    definition: "Sannsynligheten $f(\\varepsilon) = 1/(e^{(\\varepsilon - \\mu)/k_BT} + 1)$ for at en tilstand med energi $\\varepsilon$ er besatt av et fermion, som et elektron. Ved $T = 0$ er den 1 under det kjemiske potensialet $\\mu$ og 0 over, og ved $T > 0$ rundes trinnet av over noen få $k_BT$."
  - term: Fermi-energi
    section: Fri elektrongass
    definition: "Energien $\\varepsilon_F$ til de høyest besatte tilstandene ved $T = 0$, lik det kjemiske potensialet ved $T = 0$. For frie elektroner er $\\varepsilon_F = (\\hbar^2/2m)(3\\pi^2n)^{2/3}$, noen få eV i metaller: 3,2 eV i natrium og 7,0 eV i kobber. Skrives også $E_F$."
  - term: Fermi-kule
    section: Fri elektrongass
    definition: "Kula med radius $k_F = (3\\pi^2n)^{1/3}$ i $k$-rommet som de besatte tilstandene fyller ved $T = 0$ i fri-elektronmodellen. Overflaten er Fermi-flaten. Radien avhenger bare av elektrontettheten $n$, ikke av størrelsen på krystallen."
  - term: Fermi-temperatur
    section: Fri elektrongass
    definition: "$T_F = \\varepsilon_F/k_B$, $10^4$ til $10^5$ K i metaller og langt over smeltepunktet. Fordi $T \\ll T_F$, er bare andelen omtrent $T/T_F$ av elektronene løftet over $\\varepsilon_F$, og elektronenes varmekapasitet er $C_\\text{el} = (\\pi^2/2)Nk_B\\,T/T_F$."

  # ── Laboratorieøvingene ──
  - term: Karakteristisk røntgenstråling
    section: Røntgendiffraksjon i laben
    definition: "Skarpe røntgenlinjer som et grunnstoff sender ut når et elektron faller ned i et hull i et indre skall. $K_\\alpha$ er overgangen fra L-skallet til K-skallet. Linjene ligger oppå bremsstrålingen."
  - term: Bremsstråling
    section: Røntgendiffraksjon i laben
    definition: "Det kontinuerlige røntgenspekteret fra elektroner som bremses i anoden. Det strekker seg opp til energien $eV$ elektronene ble akselerert med."
  - term: Bølgetall
    section: Infrarød spektroskopi
    definition: "Antall bølgelengder per lengdeenhet, $\\sigma = 1/\\lambda$, i IR-spektroskopi oppgitt i cm$^{-1}$. Bølgetallet er proporsjonalt med frekvensen og fotonenergien."
  - term: Svart legeme
    section: Infrarød spektroskopi
    definition: "Et legeme som absorberer all stråling som treffer det. Spekteret det sender ut, avhenger bare av temperaturen og er gitt av Plancks strålingslov."
  - term: Wiens forskyvningslov
    section: Infrarød spektroskopi
    definition: "Toppen av Planck-kurven $I(\\nu)$ ligger ved en frekvens som er proporsjonal med temperaturen."
  - term: Stefan-Boltzmanns lov
    section: Infrarød spektroskopi
    definition: "Den totale effekten et svart legeme stråler ut per flate, er $\\sigma_\\text{SB}T^4$. Den er arealet under Planck-kurven ganget med $\\pi$."
  - term: Interferogram
    section: Infrarød spektroskopi
    definition: "Detektorsignalet i et FTIR-spektrometer som funksjon av posisjonen til det bevegelige speilet i Michelson-interferometeret. Fourier-transformen av det er spekteret."
  - term: IR-aktiv svingning
    section: Infrarød spektroskopi
    definition: "En svingning som kan absorbere infrarødt lys fordi dipolmomentet endrer seg under svingningen. En svingning der dipolmomentet er det samme hele tiden, er usynlig i et IR-spektrum."
  - term: Redusert masse
    section: Infrarød spektroskopi
    definition: "$\\mu = M_1M_2/(M_1 + M_2)$. Med den kan to atomer bundet med én fjær regnes som én oscillator."
  - term: Lysfeltbilde
    section: Elektronmikroskopi
    definition: "TEM-bilde dannet av den direkte strålen alene: objektivaperturen i bakre fokalplan slipper bare den gjennom. Områder som sprer mye, blir mørke mot lys bakgrunn. Forkortes BF (<em>bright field</em>)."
  - term: Mørkfeltbilde
    section: Elektronmikroskopi
    definition: "TEM-bilde dannet av én eller flere diffrakterte stråler, med den direkte strålen stengt ute av objektivaperturen. Områder som sprer inn i den valgte refleksen, blir lyse mot mørk bakgrunn. Forkortes DF (<em>dark field</em>)."
  - term: Masse-tykkelse-kontrast
    section: Elektronmikroskopi
    definition: "Kontrast i et TEM-bilde fordi tykke områder og tunge grunnstoffer sprer flere elektroner ut av den direkte strålen."
  - term: Diffraksjonskontrast
    section: Elektronmikroskopi
    definition: "Kontrast i et TEM-bilde fordi hvor sterkt en krystall diffrakterer, avhenger av hvordan den står i forhold til strålen. I krystallinske prøver er den oftest sterkere enn masse-tykkelse-kontrasten."
  - term: Kameralengde
    section: Elektronmikroskopi
    definition: "Den effektive avstanden $L$ fra prøven til diffraksjonsbildet i et TEM, satt av linsene. Den skalerer bildet og kalibreres med en krystall med kjente planavstander."
  - term: Soneakse
    section: Elektronmikroskopi
    definition: "Retningen $[UVW]$ elektronstrålen går langs gjennom krystallen. Alle planene som gir reflekser i diffraksjonsbildet, er parallelle med den."
  - term: SAED
    section: Elektronmikroskopi
    definition: "<em>Selected area electron diffraction</em>: diffraksjon fra et lite område av prøven, valgt med en apertur i bildeplanet. Gir diffraksjonsbildet til ett korn eller én fase."
  - term: HRTEM
    section: Elektronmikroskopi
    definition: "Høyoppløsnings-TEM: bildet dannes av den direkte og de diffrakterte strålene sammen, uten apertur, så atomplanene blir synlige som striper. Fourier-transformen av bildet ligner diffraksjonsbildet fra samme område."
  - term: Sinkblendestruktur
    section: Elektronmikroskopi
    definition: "Diamantstrukturen med to forskjellige atomer i basisen, for eksempel Ga i $(0,0,0)$ og As i $(\\tfrac14,\\tfrac14,\\tfrac14)$. GaAs, kubisk SiC og ZnS har denne strukturen."
  - term: Wurtsittstruktur
    section: Elektronmikroskopi
    definition: "Den heksagonale varianten av sinkblendestrukturen. De tettpakkede dobbeltlagene av de to atomtypene er stablet ABAB i stedet for ABCABC, slik hcp forholder seg til fcc."

